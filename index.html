<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pokémon Pokopia</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
:root{--bg:#f3e8fd;--card:#ffffff;--txt:#1a1a1a;--sub-rgb:143,122,168;--sub:#8f7aa8;--accent:#af8dce;--border:rgba(var(--sub-rgb),.35);--heart:#ffb0c8;--heart-empty:rgba(var(--sub-rgb),.55);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none;}
html{overflow-y:scroll;overflow-x:hidden;scrollbar-gutter:stable both-edges;}
@media (hover:hover) and (pointer:fine){
#mpanel{scrollbar-gutter:stable both-edges;}
html::-webkit-scrollbar,#mpanel::-webkit-scrollbar{width:12px;height:12px;}
html::-webkit-scrollbar-track,#mpanel::-webkit-scrollbar-track{background:transparent;}
html::-webkit-scrollbar-thumb,#mpanel::-webkit-scrollbar-thumb{background:transparent;border:3px solid transparent;border-radius:10px;background-clip:padding-box;transition:background .25s;}
html.scrolling::-webkit-scrollbar-thumb,#mpanel.scrolling::-webkit-scrollbar-thumb{background:rgba(43,33,64,.28);border:3px solid transparent;background-clip:padding-box;}
html.scrolling::-webkit-scrollbar-thumb:hover,#mpanel.scrolling::-webkit-scrollbar-thumb:hover{background:rgba(43,33,64,.42);border:3px solid transparent;background-clip:padding-box;}
html,#mpanel{scrollbar-width:thin;scrollbar-color:rgba(43,33,64,0) transparent;}
html.scrolling,#mpanel.scrolling{scrollbar-color:rgba(43,33,64,.28) transparent;}
}
html,body{margin:0;padding:0;overscroll-behavior-y:none;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;}
header{position:sticky;top:0;z-index:15;background:linear-gradient(180deg,#ffffff,var(--bg) 55%);padding:13px 14px 9px;}
.title{display:flex;align-items:center;gap:9px;margin:0 0 9px;padding-right:43px;min-height:34px;}
#hlogo,#htitle{cursor:pointer;}
.title img{width:24px;height:24px;object-fit:contain;}
.title h1{font-size:16px;font-weight:800;margin:0;letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.viewtoggle{display:flex;gap:5px;flex:0 0 auto;}
.viewtoggle button{border-radius:8px;padding:6px 9px;font-size:11px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--txt);cursor:pointer;white-space:nowrap;}
.viewtoggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
#menubtnWrap{position:fixed;top:0;left:0;right:0;max-width:520px;margin:0 auto;z-index:33;display:flex;justify-content:flex-end;pointer-events:none;}
#menubtn{position:relative;margin-top:13px;margin-right:14px;width:34px;height:34px;padding:0;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;pointer-events:auto;flex-shrink:0;}
#menubtn span{display:block;width:19px;height:3px;border-radius:2px;background:var(--accent);transform-origin:center;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .2s ease;}
#menubtn.open span:nth-child(1){transform:translateY(8px) rotate(45deg);}
#menubtn.open span:nth-child(2){opacity:0;transform:scaleX(0);}
#menubtn.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg);}
.searchwrap{position:relative;margin:0 0 9px;}
.search{width:100%;padding:9px 38px 9px 12px;border-radius:11px;border:1px solid var(--border);background:#ffffff;color:var(--txt);font-size:13px;outline:none;}
.search:focus{border-color:var(--accent);}
.qclear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;padding:0;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qclear svg{width:15px;height:15px;}
.qclear svg path{stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;}
.search::placeholder{color:rgba(var(--sub-rgb),.7);}
.suggest{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#ffffff;border:1px solid var(--border);border-radius:11px;box-shadow:0 8px 24px rgba(43,33,64,.15);max-height:108px;overflow-y:auto;z-index:25;display:none;}
.suggest.open{display:block;}
.suggest .sitem{padding:9px 12px;font-size:13px;cursor:pointer;color:var(--txt);}
.suggest .sitem:hover{background:var(--bg);}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:11px 0 2px;}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:var(--bg);color:var(--txt);font-size:12.5px;font-weight:600;border:1.5px solid transparent;cursor:pointer;white-space:nowrap;}
.chip img{width:16px;height:16px;object-fit:contain;}
.chip.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(175,141,206,.22) inset;}
.chip.active-view{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:none;}
.chip .chipsvg{width:16px;height:16px;display:flex;flex:0 0 auto;}
.chip .chipsvg svg{width:100%;height:100%;display:block;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px 12px;}
.sitefooter{font-size:7.5px;color:var(--accent);text-align:center;line-height:1.5;padding:6px 22px 20px;}
.card{position:relative;aspect-ratio:1/1;background:var(--card);border-radius:13px;padding:5px 3px 4px;overflow:hidden;border:1px solid var(--border);}
.card .no{position:absolute;top:3px;left:5px;font-size:8.5px;color:var(--sub);font-weight:700;user-select:none;z-index:2;}
.card .heart{position:absolute;top:24px;left:3px;width:17px;height:17px;z-index:3;cursor:pointer;}
.card .heart svg{width:100%;height:100%;display:block;}
.card .heart path{fill:none;stroke:var(--heart-empty);stroke-width:1.3;}
.card .heart.liked path{fill:var(--heart);stroke:var(--heart);}
.card .badges{position:absolute;top:3px;right:3px;display:flex;flex-direction:column;align-items:center;gap:1px;z-index:2;}
.card .badges img{width:17px;height:17px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));}
.card .badges .sep{width:16px;height:1px;background:var(--border);margin:4px 0;flex:0 0 auto;}
.card img.sp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:74%;height:54%;object-fit:contain;}
.card .nm{position:absolute;left:0;right:0;bottom:10px;font-size:10px;font-weight:700;line-height:1.15;text-align:center;word-break:keep-all;padding:0 3px;}
.empty{text-align:center;color:var(--sub);padding:50px 20px;font-size:13px;}
.grid .empty{grid-column:1/-1;}
.rlist{display:flex;flex-direction:column;gap:8px;padding:12px 14px 44px;}
.rrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:10px 12px;}
.rrow .ricon{width:62px;height:62px;flex:0 0 auto;object-fit:contain;}
.rinfo{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;align-items:start;flex:1;}
.rinfo .k{color:var(--sub);font-weight:700;white-space:nowrap;}
.rinfo .v{font-weight:600;word-break:keep-all;}

.rinfo .v{display:flex;flex-wrap:wrap;align-items:center;gap:4px;}
.rinfo .fi{width:15px;height:15px;}
.ing{display:inline-flex;align-items:center;gap:3px;background:var(--bg);border-radius:7px;padding:2px 7px 2px 4px;font-size:11.5px;}
.ing img{width:17px;height:17px;object-fit:contain;}
.plus{color:var(--sub);font-weight:800;}
.req{display:inline-flex;align-items:center;gap:3px;background:var(--accent);border:none;border-radius:7px;padding:2px 8px 2px 5px;font-size:11.5px;color:#ffffff;font-weight:700;}
.req img{width:15px;height:15px;object-fit:contain;}
#menuOverlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(43,33,64,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .18s ease;}
#menuOverlay.open{opacity:1;pointer-events:auto;}
#mpanelWrap{position:fixed;top:0;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:31;display:flex;justify-content:flex-end;pointer-events:none;}
#mpanel{position:relative;width:min(320px,88vw);height:100%;background:#ffffff;padding:0 16px 20px;overflow-y:auto;display:flex;flex-direction:column;overscroll-behavior:contain;box-shadow:-6px 0 24px rgba(43,33,64,.18);opacity:0;transform:scale(.96);transform-origin:top right;pointer-events:none;transition:opacity .15s ease,transform .15s ease;}
#mpanel.open{opacity:1;transform:scale(1);pointer-events:auto;}
.mtitle{display:flex;align-items:center;gap:8px;margin:0;position:sticky;top:0;padding:18px 0 6px;background:#ffffff;z-index:1;}
.mtitle img{width:22px;height:22px;object-fit:contain;}
.mtitle span{font-size:15px;font-weight:800;}
.mgrouptitle{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;color:var(--txt);margin:16px 0 2px;}
.mgrouptitle.mgap{margin-top:34px;}
.mgrouptitle::after{content:'';flex:1;height:1px;background:var(--border);}
.msec h3{font-size:12px;color:var(--sub);margin:16px 0 8px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;}
.msec h3 .mtxt{display:flex;align-items:center;gap:6px;}
.msec h3 .lockbtn{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;flex:0 0 auto;cursor:pointer;}
.msec h3 .lockbtn svg{width:100%;height:100%;display:block;}
.msec h3 .lockbtn path,.msec h3 .lockbtn rect{fill:none;stroke:var(--sub);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.msec h3 .lockbtn.locked path,.msec h3 .lockbtn.locked rect{stroke:var(--accent);}
.msec h3 .lockbtn.locked rect{fill:var(--accent);}
body.affLock .card .heart{cursor:not-allowed;}
.msec h3 .car{font-size:10px;color:var(--sub);transition:transform .2s;}
.msec.collapsed h3{margin-bottom:0;}
.msec.collapsed .car{transform:rotate(-90deg);}
.msec.collapsed .chips{display:none;}
#mpanel .chips{padding:0;}
.mdivider{height:1px;background:var(--border);margin:14px 0 0;flex:0 0 auto;}
.mgreet{display:none;font-size:12.5px;color:var(--sub);text-align:left;margin-top:30px;}
.mgreet.show{display:block;}
.mfooter{padding-top:6px;display:flex;gap:8px;}
.mbig{flex:1;text-align:center;background:var(--bg);border:1px solid var(--border);color:var(--txt);border-radius:12px;padding:8px;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;}
.modal{display:none;position:fixed;inset:0;background:rgba(43,33,64,.45);z-index:40;align-items:center;justify-content:center;padding:24px;}
.modal.open{display:flex;}
.modal .box{background:#ffffff;border-radius:16px;padding:26px 22px;width:100%;max-width:300px;text-align:center;box-shadow:0 10px 40px rgba(43,33,64,.25);}
.modal h2{font-size:16px;margin:0 0 14px;font-weight:800;color:var(--txt);}
.modal input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--txt);font-size:14px;padding:10px 12px;margin-bottom:9px;outline:none;font-family:inherit;}
.modal input:focus{border-color:var(--accent);}
.modeswitch{font-size:11.5px;color:var(--sub);margin-top:10px;}
.modeswitch a{color:var(--accent);font-weight:700;text-decoration:none;cursor:pointer;}
.modal button.primary{margin-top:4px;width:100%;background:var(--accent);border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;color:#ffffff;cursor:pointer;}
.modal button.primary span{display:inline-block;color:#ffffff;transition:opacity .18s ease;}
.modal button.secondary{margin-top:8px;width:100%;background:none;border:none;color:var(--sub);font-size:12.5px;padding:6px;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="title"><img id="hlogo" referrerpolicy="no-referrer" src="img/monsterball.png" alt="ball"><h1 id="htitle">Pokémon Pokopia</h1><div class="viewtoggle"><button id="vtGrid" type="button">포켓몬</button><button id="vtRecipe" type="button">음식 레시피</button></div></div>
  <div class="searchwrap">
    <input id="q" class="search" type="text" placeholder="포켓몬 이름 검색" autocomplete="off">
    <button id="qclear" class="qclear" type="button" aria-label="검색어 지우기"><svg viewBox="0 0 24 24"><path d="M6 6L18 18M18 6L6 18"/></svg></button>
    <div id="suggestBox" class="suggest"></div>
  </div>
</header>
<div class="grid" id="main"></div>
<div class="sitefooter">본 사이트는 팬이 만든 비공식 사이트로, 닌텐도, 게임프리크, 주식회사 포켓몬과는 어떠한 관계도 없습니다. Pokemon은 닌텐도 / Creatures Inc. / Game Freak Inc.의 상표입니다. 모든 게임 콘텐츠, 이미지, 상표는 각 권리자에게 귀속됩니다.</div>
</div>
<div id="menubtnWrap"><button id="menubtn" type="button" aria-label="메뉴"><span></span><span></span><span></span></button></div>
<div id="menuOverlay"></div>
<div id="mpanelWrap">
  <div id="mpanel">
    <div class="mtitle"><img referrerpolicy="no-referrer" src="img/monsterball.png" alt="ball"><span>Pokémon Pokopia</span></div>
    <div class="mgrouptitle">포켓몬</div>
    <div class="msec" data-key="dexcat"><h3>포켓몬 도감<span class="car">▾</span></h3><div class="chips" id="chips-dexcat"></div></div>
    <div class="msec" data-key="type"><h3>타입<span class="car">▾</span></h3><div class="chips" id="chips-type"></div></div>
    <div class="msec" data-key="spec"><h3>특기<span class="car">▾</span></h3><div class="chips" id="chips-spec"></div></div>
    <div class="msec" data-key="flavor"><h3>좋아하는 맛<span class="car">▾</span></h3><div class="chips" id="chips-flavor"></div></div>
    <div class="msec" data-key="affinity"><h3><span class="mtxt">친밀도<span class="lockbtn" id="affLockBtn" title="찜 잠금/해제"></span></span><span class="car">▾</span></h3><div class="chips" id="chips-affinity"></div></div>
    <div class="mgrouptitle mgap">음식 레시피</div>
    <div class="msec" data-key="rcat"><h3>종류<span class="car">▾</span></h3><div class="chips" id="chips-rcat"></div></div>
    <div class="msec" data-key="rflavor"><h3>맛<span class="car">▾</span></h3><div class="chips" id="chips-rflavor"></div></div>
    <div id="mgreet" class="mgreet"></div>
    <div class="mfooter">
      <a class="mbig" href="https://iruroda.github.io/pokelab/" target="_blank" rel="noopener">Pokélab 메인으로</a>
      <button class="mbig" id="loginBtn" type="button">로그인</button>
    </div>
  </div>
</div>
<div id="loginModal" class="modal">
  <div class="box">
    <h2 id="loginTitle">로그인</h2>
    <input id="loginId" type="text" placeholder="아이디" autocomplete="username">
    <input id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="primary" id="loginSubmit" type="button"><span id="loginBtnTxt">확인</span></button>
    <button class="secondary" id="loginCancel" type="button">닫기</button>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    const fic=(p.name!=='메타몽'&&FLAVOR_ICON[p.flavor])?`<img referrerpolicy="no-referrer" src="${FLAVOR_ICON[p.flavor]}" title="${p.flavor}">`:'';
    const liked=LIKED.has(String(p.no))?' liked':'';
    return `<div class="card"><span class="no">${/^E/.test(String(p.no))?p.no:String(p.no).padStart(3,'0')}</span><span class="heart${liked}" data-no="${p.no}"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></span><span class="badges">${[tic,sic,fic].filter(Boolean).join('<span class="sep"></span>')}</span><img class="sp" loading="lazy" referrerpolicy="no-referrer" data-dex="${p.dex}"${alt} src="${src}" alt="${p.name}" onerror="imgFail(this)"><span class="nm">${p.name}</span></div>`;
  }).join(''):'<div class="empty">검색 결과가 없습니다.</div>';
}
function hideSuggest(){const b=document.getElementById('suggestBox');b.classList.remove('open');b.innerHTML='';}
function updateSuggest(){
  const box=document.getElementById('suggestBox');
  if(!q){hideSuggest();return;}
  const pool=view==='recipe'?uniq(RECIPES.map(r=>r.name)):uniq(DATA.map(p=>p.name));
  const matches=pool.filter(n=>n.includes(q)).slice(0,8);
  if(!matches.length){hideSuggest();return;}
  box.innerHTML='';
  matches.forEach(n=>{
    const d=document.createElement('div');d.className='sitem';d.textContent=n;
    d.onmousedown=(e)=>{e.preventDefault();q=n;document.getElementById('q').value=n;hideSuggest();renderMain();};
    box.appendChild(d);
  });
  box.classList.add('open');
}

// 아이디 <-> 가짜 이메일 변환 (todayspokemon의 idToEmail과 완전히 동일한 규칙)
function idToEmail(id){
  var hex="",bytes=unescape(encodeURIComponent(id));
  for(var i=0;i<bytes.length;i++){var h=bytes.charCodeAt(i).toString(16);hex+=(h.length<2?"0":"")+h;}
  return "u"+hex+"@todayspokemon.app";
}
function emailToId(email){
  try{
    var hex=email.slice(1,email.indexOf('@'));
    var bytes="";
    for(var i=0;i<hex.length;i+=2){bytes+=String.fromCharCode(parseInt(hex.substr(i,2),16));}
    return decodeURIComponent(escape(bytes));
  }catch(e){return email;}
}

let CUR_USER=null;
function likeKey(){return 'pokopia_likes_'+(CUR_USER||'guest');}
let LIKED=new Set(JSON.parse(localStorage.getItem(likeKey())||'[]'));
function saveLikesLocal(){localStorage.setItem(likeKey(),JSON.stringify([...LIKED]));}
function saveLikesRemote(uid){
  if(!db||!uid)return;
  db.collection('pokopiaLikes').doc(uid).set({nos:[...LIKED],updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
    .catch(function(e){console.error('하트 저장 실패(Firestore 규칙 확인 필요)',e);});
}
function saveLikes(){
  saveLikesLocal();
  if(fbAuth&&fbAuth.currentUser)saveLikesRemote(fbAuth.currentUser.uid);
}

let loginBtnMsgTimer=null;
function loginBtnFlash(text){
  const btxt=document.getElementById('loginBtnTxt');
  clearTimeout(loginBtnMsgTimer);
  btxt.style.opacity='0';
  setTimeout(()=>{btxt.textContent=text;btxt.style.opacity='1';},180);
  loginBtnMsgTimer=setTimeout(()=>{
    btxt.style.opacity='0';
    setTimeout(()=>{btxt.textContent='확인';btxt.style.opacity='1';},180);
  },1800);
}
function openLogin(){clearTimeout(loginBtnMsgTimer);const btxt=document.getElementById('loginBtnTxt');btxt.textContent='확인';btxt.style.opacity='1';document.getElementById('loginId').value='';document.getElementById('loginPw').value='';document.getElementById('loginModal').classList.add('open');}

document.getElementById('loginId').addEventListener('keydown',loginEnterKey);
document.getElementById('loginPw').addEventListener('keydown',loginEnterKey);
document.getElementById('loginBtn').onclick=()=>{
  if(CUR_USER){
    if(fbAuth)fbAuth.signOut();
    return;
  }
  openLogin();
};
function mergeGuestLikesInto(uid){
  return db.collection('pokopiaLikes').doc(uid).get().then(function(doc){
    const remote=new Set(doc.exists&&doc.data().nos?doc.data().nos:[]);
    LIKED.forEach(x=>remote.add(x));
    LIKED=remote;
    return db.collection('pokopiaLikes').doc(uid).set({nos:[...LIKED],updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  });
}
document.getElementById('loginSubmit').onclick=()=>{
  const id=document.getElementById('loginId').value.trim();
  const pw=document.getElementById('loginPw').value;
  const btn=document.getElementById('loginSubmit');
  const btxt=document.getElementById('loginBtnTxt');
  if(!id||!pw){loginBtnFlash('아이디와 비밀번호를 입력해주세요.');return;}
  if(!fbAuth){loginBtnFlash('서버 연결이 안 돼 로그인할 수 없습니다.');return;}
  if(pw.length<6){loginBtnFlash('비밀번호는 6자 이상이어야 합니다.');return;}
  const email=idToEmail(id);
  if(email.length>80){loginBtnFlash('아이디가 너무 깁니다.');return;}
  clearTimeout(loginBtnMsgTimer);btn.disabled=true;btxt.textContent='로그인 중…';btxt.style.opacity='1';
  fbAuth.signInWithEmailAndPassword(email,pw)
    .then(function(cred){return mergeGuestLikesInto(cred.user.uid).catch(function(mergeErr){console.error('찜 병합 실패',mergeErr);});})
    .then(function(){
      btn.disabled=false;btxt.textContent='확인';btxt.style.opacity='1';
      closeLogin();closeMenu();
    })
    .catch(function(err){
      btn.disabled=false;
      const code=err&&err.code;
      if(code==='auth/user-not-found'){loginBtnFlash('존재하지 않는 아이디입니다.');}
      else if(code==='auth/wrong-password'){loginBtnFlash('비밀번호가 일치하지 않아요.');}
      else if(code==='auth/invalid-email'){loginBtnFlash('아이디 형식이 올바르지 않아요.');}
      else if(code==='auth/network-request-failed'){loginBtnFlash('네트워크 연결을 확인해주세요.');}
      else if(code==='auth/too-many-requests'){loginBtnFlash('시도가 너무 많아요. 잠시 후 다시 시도해주세요.');}
      else{loginBtnFlash('계정 정보가 일치하지 않습니다.');console.error(err);}
    });
};

if(fbAuth){

      LIKED=new Set(JSON.parse(localStorage.getItem(likeKey())||'[]'));
      updateAuthUI();renderMain();
    }
  });
}
